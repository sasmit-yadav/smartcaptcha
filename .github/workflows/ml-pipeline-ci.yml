name: ML pipeline CI

# Guards against the two failure modes that silently broke the pipeline
# before (docs/MODEL_IMPROVEMENT_STRATEGY.md Findings 1 & 0.5):
# - training code that no longer runs (import rot, duplicate defs)
# - the 52-field feature contract drifting between its three copies

on:
  push:
    paths:
      - "ml-train/**"
      - "sdk-backend/features/**"
      - "sdk-backend/models/**"
      - "sdk/src/core/features.ts"
      - ".github/workflows/ml-pipeline-ci.yml"
  pull_request:
    paths:
      - "ml-train/**"
      - "sdk-backend/features/**"
      - "sdk-backend/models/**"
      - "sdk/src/core/features.ts"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install numpy pandas scikit-learn xgboost joblib psycopg2-binary python-dotenv pytest
      - name: Run ml-train tests (feature contract + training smoke)
        run: |
          cd ml-train
          python -m pytest tests/ -v
