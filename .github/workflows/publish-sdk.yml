name: Publish SDK

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v0.1.0

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        working-directory: ./sdk
        run: npm ci
      
      - name: Build SDK
        working-directory: ./sdk
        run: npm run build
      
      - name: Run tests (when available)
        working-directory: ./sdk
        run: npm test || echo "Tests not yet implemented"
        continue-on-error: true
      
      - name: Publish to npm
        working-directory: ./sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      
      # CDN upload step (requires CDN credentials in secrets)
      - name: Upload to CDN
        if: secrets.CDN_ENDPOINT != ''
        env:
          CDN_ENDPOINT: ${{ secrets.CDN_ENDPOINT }}
          CDN_ACCESS_KEY: ${{ secrets.CDN_ACCESS_KEY }}
          CDN_SECRET_KEY: ${{ secrets.CDN_SECRET_KEY }}
        run: |
          echo "Uploading to CDN..."
          # Upload dist files to CDN/object storage
          # This is a placeholder - implement based on your CDN provider
          # Example for AWS S3:
          # aws s3 sync dist/ s3://cdn.smartcaptcha.ai/v0.1.0/
          # aws s3 cp dist/smartcaptcha.min.js s3://cdn.smartcaptcha.ai/latest/smartcaptcha.min.js
          echo "CDN upload complete"
