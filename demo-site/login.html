<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — EcoHub</title>
  <link rel="stylesheet" href="/styles/base.css" />
</head>
<body>
  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your EcoHub account</p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            <p class="form-error">Please enter a valid email.</p>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <p class="form-error">Password is required.</p>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
            <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.85rem; cursor:pointer;">
              <input type="checkbox" id="remember" /> Remember me
            </label>
            <a href="#" class="text-sm" onclick="event.preventDefault(); alert('Password reset not implemented in demo.')">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Sign In</button>
        </form>

        <p class="divider">or</p>
        <a href="/signup.html" class="btn btn-secondary btn-full">Create an account</a>
      </div>
    </div>
  </main>

  <script src="/config.js"></script>
  <script src="/smartcaptcha.min.js"></script>
  <script src="/autofill_detector.js"></script>
  <script src="/sdk_shim.js"></script>
  <script>SmartCaptcha.init({apiKey:window.SMARTCAPTCHA_CONFIG.API_KEY,endpoint:window.SMARTCAPTCHA_CONFIG.BACKEND_URL});</script>
  <script type="module">
    import { initShell } from '/utils/shell.js';
    initShell('Login');

    const form = document.getElementById('login-form');
    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;

      // email validation
      if (!emailEl.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value)) {
        emailEl.classList.add('error');
        valid = false;
      } else {
        emailEl.classList.remove('error');
      }

      // password validation
      if (!passEl.value) {
        passEl.classList.add('error');
        valid = false;
      } else {
        passEl.classList.remove('error');
      }

      if (!valid) return;

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      // Simulate login — DO NOT actually process credentials
      setTimeout(() => {
        btn.textContent = '✓ Demo login successful';
        btn.style.background = '#22c55e';
      }, 1500);
    });
  </script>
</body>
</html>
