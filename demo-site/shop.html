<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eco Shop — EcoHub</title>
  <link rel="stylesheet" href="/styles/base.css" />
  <style>
    .shop-layout { display:grid; grid-template-columns:220px 1fr; gap:2rem; }
    .sidebar h3 { font-size:0.85rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--color-text-muted); margin-bottom:0.75rem; }
    .sidebar label { display:flex; align-items:center; gap:0.5rem; font-size:0.9rem; margin-bottom:0.5rem; cursor:pointer; }
    .search-bar { display:flex; gap:0.5rem; margin-bottom:2rem; }
    .search-bar input { flex:1; }
    .cart-badge { background:var(--color-primary); color:#fff; border-radius:50%; width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; }
    .pagination { display:flex; gap:0.5rem; justify-content:center; margin-top:2rem; }
    .pagination button { padding:0.4rem 0.9rem; border:1px solid var(--color-border); border-radius:var(--color-radius); background:var(--color-surface); cursor:pointer; font-weight:600; font-size:0.85rem; transition:all var(--transition); }
    .pagination button.active, .pagination button:hover { background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
    @media(max-width:768px) { .shop-layout { grid-template-columns:1fr; } .sidebar { display:none; } }
  </style>
</head>
<body>
  <main class="main-content">
    <div class="container">
      <!-- Header row -->
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem;">
        <h1>Eco Shop</h1>
        <div style="display:flex; align-items:center; gap:0.4rem; font-size:0.9rem; color:var(--color-text-muted);">
          🛒 Cart <span class="cart-badge" id="cart-count">0</span>
        </div>
      </div>

      <!-- Search -->
      <div class="search-bar">
        <input class="form-input" type="text" id="search" placeholder="Search products…" />
        <button class="btn btn-primary">Search</button>
      </div>

      <div class="shop-layout">
        <!-- Sidebar filters -->
        <aside class="sidebar">
          <h3>Categories</h3>
          <label><input type="checkbox" class="filter-cat" value="energy" /> Green Energy</label>
          <label><input type="checkbox" class="filter-cat" value="home" /> Eco Home</label>
          <label><input type="checkbox" class="filter-cat" value="garden" /> Garden</label>
          <label><input type="checkbox" class="filter-cat" value="kitchen" /> Sustainable Kitchen</label>
          <label><input type="checkbox" class="filter-cat" value="personal" /> Personal Care</label>
        </aside>

        <!-- Product grid -->
        <div>
          <div class="product-grid" id="product-grid"></div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/smartcaptcha.min.js"></script>
  <script>SmartCaptcha.init({apiKey:"demo-key",endpoint:"http://localhost:8000"});</script>
  <script type="module">
    import { initShell } from '/utils/shell.js';
    initShell('Shop');

    // Fake product data
    const PRODUCTS = Array.from({ length: 12 }, (_, i) => ({
      id: i + 1,
      title: [
        'Solar Phone Charger', 'Bamboo Water Bottle', 'Reusable Beeswax Wraps', 'Compost Bin Kit',
        'LED Grow Light', 'Organic Cotton Tote', 'Rain Water Collector', 'Bamboo Cutlery Set',
        'Seed Starter Kit', 'Recycled Notebook', 'Solar Garden Lamp', 'Herb Garden Kit'
      ][i],
      price: [39.99, 24.99, 15.00, 29.95, 44.00, 12.99, 54.99, 18.00, 22.50, 9.95, 34.99, 27.00][i],
      img: `https://picsum.photos/seed/eco${i+1}/400/300`,
      category: ['energy','kitchen','kitchen','garden','energy','personal','garden','kitchen','garden','personal','energy','garden'][i],
    }));

    const PER_PAGE = 8;
    let page = 1;
    let cart = 0;
    const grid = document.getElementById('product-grid');
    const pagEl = document.getElementById('pagination');
    const cartBadge = document.getElementById('cart-count');

    function render() {
      const start = (page - 1) * PER_PAGE;
      const items = PRODUCTS.slice(start, start + PER_PAGE);

      grid.innerHTML = items.map(p => `
        <div class="card product-card">
          <img src="${p.img}" alt="${p.title}" loading="lazy" />
          <div class="product-info">
            <p class="product-title">${p.title}</p>
            <p class="product-price">$${p.price.toFixed(2)}</p>
            <button class="btn btn-primary btn-full" data-id="${p.id}">Add to Cart</button>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('button[data-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          cart++;
          cartBadge.textContent = cart;
          btn.textContent = '✓ Added';
          btn.style.background = '#22c55e';
          setTimeout(() => {
            btn.textContent = 'Add to Cart';
            btn.style.background = '';
          }, 1200);
        });
      });

      // Pagination
      const totalPages = Math.ceil(PRODUCTS.length / PER_PAGE);
      pagEl.innerHTML = '';
      for (let i = 1; i <= totalPages; i++) {
        const b = document.createElement('button');
        b.textContent = i;
        if (i === page) b.classList.add('active');
        b.addEventListener('click', () => { page = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
        pagEl.appendChild(b);
      }
    }

    render();
  </script>
</body>
</html>
