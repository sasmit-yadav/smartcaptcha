<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — EcoHub</title>
  <link rel="stylesheet" href="/styles/base.css" />
  <style>
    .strength-bar { height:4px; border-radius:2px; background:var(--color-border); margin-top:0.35rem; overflow:hidden; }
    .strength-fill { height:100%; width:0; border-radius:2px; transition:width .25s, background .25s; }
    .strength-text { font-size:0.75rem; color:var(--color-text-muted); margin-top:0.2rem; }
  </style>
</head>
<body>
  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card" style="max-width:460px;">
        <h1>Create account</h1>
        <p class="subtitle">Join the EcoHub community</p>

        <form id="signup-form" novalidate>
          <!-- Honeypot (strategy step 7): off-screen, aria-hidden, tabindex -1.
               No human sees or tabs to it; naive bots that fill every field trip
               it, which session.js reports as honeypotTriggered. -->
          <input type="text" name="contact_url" data-vp-honeypot="1" tabindex="-1"
                 autocomplete="off" aria-hidden="true"
                 style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;" />
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label" for="fname">First name</label>
              <input class="form-input" type="text" id="fname" placeholder="Jane" required />
              <p class="form-error">Required.</p>
            </div>
            <div class="form-group">
              <label class="form-label" for="lname">Last name</label>
              <input class="form-input" type="text" id="lname" placeholder="Doe" required />
              <p class="form-error">Required.</p>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input class="form-input" type="email" id="email" placeholder="you@example.com" required />
            <p class="form-error">Enter a valid email.</p>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" placeholder="Min 8 characters" required />
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
            <p class="strength-text" id="strength-text"></p>
            <p class="form-error">Min 8 characters required.</p>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm">Confirm password</label>
            <input class="form-input" type="password" id="confirm" placeholder="Re-enter password" required />
            <p class="form-error">Passwords do not match.</p>
          </div>

          <div class="form-group" style="display:flex; align-items:flex-start; gap:0.5rem;">
            <input type="checkbox" id="terms" style="margin-top:0.3rem;" required />
            <label for="terms" style="font-size:0.85rem; cursor:pointer;">
              I agree to the <a href="#" onclick="event.preventDefault()">Terms of Service</a> and <a href="#" onclick="event.preventDefault()">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Create Account</button>
        </form>

        <p class="divider">Already have an account?</p>
        <a href="/login.html" class="btn btn-secondary btn-full">Sign in instead</a>
      </div>
    </div>
  </main>

  <script src="/config.js"></script>
  <script src="/autofill_detector.js"></script>
  <script type="module">
    import { initShell } from '/utils/shell.js';
    import { getSessionId, getSessionMeta } from '/utils/session.js';
    initShell('Sign Up');

    // Telemetry tracking
    const telemetry = {
      mouseMovements: [],
      clicks: [],
      scrolls: [],
      hovers: [],
      keyEvents: [],
      startTime: Date.now(),
      lastMousePos: { x: 0, y: 0 },
      lastMouseTime: Date.now(),
      totalDistance: 0
    };

    // Start session
    async function startSession() {
      try {
        const sessionId = getSessionId();
        const meta = getSessionMeta();
        
        // Only start session if not already started in this tab
        if (!sessionStorage.getItem('sc_session_started')) {
          await fetch(`${window.NEXTCAPTCHA_CONFIG.BACKEND_URL}/api/session/start`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ sessionId, meta })
          });
          sessionStorage.setItem('sc_session_started', 'true');
          console.log('Session started:', sessionId);
        } else {
          console.log('Reusing existing session:', sessionId);
        }
      } catch (error) {
        console.error('Failed to start session:', error);
      }
    }

    // Start session on load
    startSession();

    // Track mouse movements with velocity, distance, angle
    document.addEventListener('mousemove', (e) => {
      const now = Date.now();
      const dx = e.clientX - telemetry.lastMousePos.x;
      const dy = e.clientY - telemetry.lastMousePos.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const dt = now - telemetry.lastMouseTime;
      const vel = dt > 0 ? (dist / dt) * 1000 : 0; // px/sec
      const ang = Math.atan2(dy, dx) * (180 / Math.PI);
      
      telemetry.totalDistance += dist;
      
      telemetry.mouseMovements.push({ 
        x: e.clientX, 
        y: e.clientY, 
        time: now,
        dist: dist,
        ang: ang,
        vel: vel,
        totalDist: telemetry.totalDistance
      });
      
      telemetry.lastMousePos = { x: e.clientX, y: e.clientY };
      telemetry.lastMouseTime = now;
    });

    // Track clicks with target info and timing
    let lastClickTime = Date.now();
    document.addEventListener('click', (e) => {
      const now = Date.now();
      const target = e.target.tagName.toLowerCase();
      const rect = e.target.getBoundingClientRect();
      const interval = now - lastClickTime;
      
      telemetry.clicks.push({ 
        x: e.clientX, 
        y: e.clientY, 
        time: now,
        target: target,
        tw: rect.width,
        th: rect.height,
        interval: interval
      });
      
      lastClickTime = now;
    });

    // Track scrolls with velocity and direction
    let lastScrollY = window.scrollY;
    let lastScrollTime = Date.now();
    document.addEventListener('scroll', () => {
      const now = Date.now();
      const scrollY = window.scrollY;
      const dy = scrollY - lastScrollY;
      const dt = now - lastScrollTime;
      const vel = dt > 0 ? Math.abs(dy / dt) * 1000 : 0;
      const rev = dy < 0;
      
      telemetry.scrolls.push({
        y: scrollY,
        time: now,
        vel: vel,
        rev: rev
      });
      
      lastScrollY = scrollY;
      lastScrollTime = now;
    });

    // Track hover duration
    document.addEventListener('mouseover', (e) => {
      const target = e.target;
      const hoverStart = Date.now();
      
      const handleMouseOut = () => {
        const hoverDuration = Date.now() - hoverStart;
        if (hoverDuration > 100) { // Only track hovers > 100ms
          telemetry.hovers.push({
            target: target.tagName.toLowerCase(),
            duration: hoverDuration,
            time: Date.now()
          });
        }
        target.removeEventListener('mouseout', handleMouseOut);
      };
      
      target.addEventListener('mouseout', handleMouseOut);
    });

    // Track keyboard events
    let lastKeyTime = Date.now();
    document.addEventListener('keydown', (e) => {
      const now = Date.now();
      const iki = now - lastKeyTime;
      
      telemetry.keyEvents.push({
        type: 'kd',
        t: now,
        k: e.key,
        iki: iki
      });
      
      lastKeyTime = now;
    });

    // Send telemetry function
    async function sendTelemetry() {
      const sessionId = getSessionId();
      const meta = getSessionMeta();
      
      // Convert telemetry events to SDK format
      const events = [];
      
      // Add click events
      telemetry.clicks.forEach(c => {
        events.push({
          type: 'cl',
          t: c.time,
          x: c.x,
          y: c.y,
          target: c.target,
          tw: Math.round(c.tw),
          th: Math.round(c.th),
          interval: c.interval
        });
      });
      
      // Add mouse movement events with full features
      telemetry.mouseMovements.forEach(m => {
        events.push({
          type: 'mm',
          t: m.time,
          x: m.x,
          y: m.y,
          dist: m.dist,
          ang: m.ang,
          vel: m.vel,
          totalDist: m.totalDist
        });
      });
      
      // Add scroll events with full features
      telemetry.scrolls.forEach(s => {
        events.push({
          type: 'sc',
          t: s.time,
          y: s.y,
          vel: s.vel,
          rev: s.rev
        });
      });
      
      // Add hover events
      telemetry.hovers.forEach(h => {
        events.push({
          type: 'fv', // focus/visibility event
          t: h.time,
          target: h.target,
          hoverDuration: h.duration
        });
      });
      
      // Add keyboard events
      telemetry.keyEvents.forEach(k => {
        events.push({
          type: k.type,
          t: k.t,
          k: k.k,
          iki: k.iki
        });
      });
      
      if (events.length === 0) {
        console.log('No events to send');
        return;
      }
      
      const payload = {
        sessionId,
        meta,
        events,
        timestamp: Date.now()
      };
      
      try {
        await fetch(`${window.NEXTCAPTCHA_CONFIG.BACKEND_URL}/api/telemetry`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload),
          keepalive: true
        });
        console.log(`Telemetry sent: ${events.length} events`);
        
        // Clear sent events
        telemetry.clicks = [];
        telemetry.mouseMovements = [];
        telemetry.scrolls = [];
        telemetry.hovers = [];
        telemetry.keyEvents = [];
      } catch (error) {
        console.error('Failed to send telemetry:', error);
      }
    }

    // Send telemetry on page unload
    window.addEventListener('beforeunload', () => {
      sendTelemetry();
    });

    // Send telemetry every 30 seconds
    setInterval(sendTelemetry, 30000);

    const form = document.getElementById('signup-form');
    const passEl = document.getElementById('password');
    const confirmEl = document.getElementById('confirm');
    const emailEl = document.getElementById('email');
    const fnameEl = document.getElementById('fname');
    const lnameEl = document.getElementById('lname');
    const termsEl = document.getElementById('terms');
    const fill = document.getElementById('strength-fill');
    const strengthText = document.getElementById('strength-text');
    const btn = document.getElementById('submit-btn');

    // Password strength
    passEl.addEventListener('input', () => {
      const v = passEl.value;
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;

      const levels = [
        { w: '0%',   bg: 'transparent', t: '' },
        { w: '25%',  bg: '#ef4444', t: 'Weak' },
        { w: '50%',  bg: '#f59e0b', t: 'Fair' },
        { w: '75%',  bg: '#22c55e', t: 'Good' },
        { w: '100%', bg: '#16a34a', t: 'Strong' },
      ];
      fill.style.width = levels[score].w;
      fill.style.background = levels[score].bg;
      strengthText.textContent = levels[score].t;
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;
      const check = (el, cond) => {
        if (!cond) { el.classList.add('error'); valid = false; }
        else { el.classList.remove('error'); }
      };

      check(fnameEl, fnameEl.value.trim().length > 0);
      check(lnameEl, lnameEl.value.trim().length > 0);
      check(emailEl, /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value));
      check(passEl, passEl.value.length >= 8);
      check(confirmEl, confirmEl.value === passEl.value && confirmEl.value.length > 0);

      if (!termsEl.checked) {
        alert('Please accept the terms.');
        valid = false;
      }
      if (!valid) return;

      btn.disabled = true;
      btn.textContent = 'Creating account…';
      setTimeout(() => {
        btn.textContent = '✓ Demo account created';
        btn.style.background = '#22c55e';
        // Store session and redirect
        localStorage.setItem('demo_user', JSON.stringify({ 
          email: emailEl.value, 
          firstName: fnameEl.value,
          lastName: lnameEl.value 
        }));
        setTimeout(() => {
          window.location.href = '/quiz.html';
        }, 800);
      }, 1500);
    });
  </script>
</body>
</html>
